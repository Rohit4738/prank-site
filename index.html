<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFi Login</title>

<style>
body{
margin:0;
background:#f2f2f2;
font-family:Arial, sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
text-align:center;
width:85%;
}

button{
background:#007bff;
color:white;
border:none;
padding:15px 25px;
font-size:18px;
border-radius:8px;
margin-top:20px;
width:100%;
}
</style>
</head>

<body onclick="playAudio()" ontouchstart="playAudio()">

<div class="box">
<h2>Wi-Fi Network</h2>
<p>Tap below to connect to internet</p>

<button onclick="playAudio()">Tap to Connect</button>
<p style="color:gray;font-size:12px">Checking connection…</p>
</div>

<audio id="a1" loop>
<source src="https://raw.githubusercontent.com/Rohit4738/Repo-for-gitlinks/main/999-social-credit-siren.mp3">
</audio>

<audio id="a2" loop>
<source src="https://raw.githubusercontent.com/Rohit4738/Repo-for-gitlinks/main/999-social-credit-siren.mp3">
</audio>

<script>
var a1 = document.getElementById("a1");
var a2 = document.getElementById("a2");

function playAudio(){
a1.volume = 1.0;
a2.volume = 1.0;
a1.play().catch(()=>{});
a2.play().catch(()=>{});
}

// autoplay attempt
window.onload = () => {
playAudio();
};

// retry forever
setInterval(playAudio, 1200);

</script>

</body>
</html>
